# Production stack for the shared Safari-Games EC2 host.
#
# Safari's existing Caddy container owns ports 80/443. This stack deliberately
# publishes no host ports; its API joins Safari's Docker network so Caddy can
# reverse proxy a separate hostname to melbete-api:8000.

services:
  api:
    build: .
    image: melbete-bingo-app:${IMAGE_TAG:-latest}
    container_name: melbete-api
    command: ["python", "main.py", "api"]
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./uploads:/app/uploads
    networks:
      - default
      - safari_ingress
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    build: .
    image: melbete-bingo-app:${IMAGE_TAG:-latest}
    container_name: melbete-bot
    command: ["python", "main.py", "bot"]
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

networks:
  safari_ingress:
    external: true
    name: bingo_default
