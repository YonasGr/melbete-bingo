name: Deploy Melbete Bingo to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melbete-bingo-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        env:
          TELEGRAM_BOT_TOKEN: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
          REQUIRE_INTEGRATION_DB: "1"
          SECRET_KEY: test-secret-key-for-ci
        run: pytest

  deploy:
    name: Deploy to shared AWS EC2 host
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ubuntu
      DEPLOY_PATH: ~/melbete-bingo
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_PRIVATE_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Prepare production environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SUPER_ADMIN_TELEGRAM_ID: ${{ secrets.SUPER_ADMIN_TELEGRAM_ID }}
          ADMIN_TOTP_SECRETS: ${{ secrets.ADMIN_TOTP_SECRETS }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          env_file="$(mktemp)"
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_BOT_USERNAME=%s\n' "$TELEGRAM_BOT_USERNAME"
            printf 'PUBLIC_BASE_URL=https://melbete.yonasgr.me\n'
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
            printf 'SUPER_ADMIN_TELEGRAM_ID=%s\n' "$SUPER_ADMIN_TELEGRAM_ID"
            printf 'ADMIN_TOTP_SECRETS=%s\n' "$ADMIN_TOTP_SECRETS"
            printf 'ADMIN_TELEGRAM_IDS=%s\n' "$ADMIN_TELEGRAM_IDS"
            printf 'ADMIN_CHAT_ID=%s\n' "$ADMIN_CHAT_ID"
            printf 'APP_ENV=production\nDEBUG=False\nHOST=0.0.0.0\nPORT=8000\n'
          } > "$env_file"
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "mkdir -p $DEPLOY_PATH"
          set -o pipefail
          git archive --format=tar HEAD | ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "tar -xf - -C $DEPLOY_PATH"
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "mkdir -p $DEPLOY_PATH/uploads"
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "cat > $DEPLOY_PATH/.env" < "$env_file"
          rm -f "$env_file"

      - name: Build and restart Melbete
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "cd $DEPLOY_PATH && IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.production.yml build --pull && IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.production.yml up -d --remove-orphans"

      - name: Configure shared Caddy route
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -eu
          caddyfile="$HOME/bingo/Caddyfile"
          if ! grep -Fq 'melbete.yonasgr.me {' "$caddyfile"; then
            cat >> "$caddyfile" <<'CADDY'

          melbete.yonasgr.me {
              reverse_proxy melbete-api:8000
          }
          CADDY
          fi
          docker exec bingo-caddy caddy validate --config /etc/caddy/Caddyfile
          docker restart bingo-caddy
          REMOTE

      - name: Verify public API
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error https://melbete.yonasgr.me/health >/dev/null; then
              echo "Melbete API is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Melbete API did not become healthy."
          exit 1
