name: Build Android APK

# Builds the Melbete Bingo Android app (android/) and uploads melbete-bingo.apk as a workflow artifact.
# Run it from the Actions tab ("Run workflow") or push a tag like android-v1.0.1.
#
# One-time setup (GitHub > Settings > Secrets and variables > Actions):
#   variable  TELEGRAM_BOT_USERNAME      your bot's username without the @   (REQUIRED)
#   secrets   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#             (your release keystore; without them the APK is signed with a debug key - see android/README.md)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users (e.g. 1.0.1)"
        default: "1.0.0"
      version_code:
        description: "Whole number, +1 for every release you publish"
        default: "1"
  push:
    tags: ["android-v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BOT: ${{ vars.TELEGRAM_BOT_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          if [ -z "$BOT" ]; then echo "::error::Set the repository variable TELEGRAM_BOT_USERNAME (your bot username, no @)"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing key (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: the APK will be signed with the debug key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          gradle -p android assembleRelease \
            -PMELBETE_BOT_USERNAME="$BOT" \
            -PMELBETE_VERSION_NAME="$VERSION_NAME" \
            -PMELBETE_VERSION_CODE="$VERSION_CODE"

      - name: Name the file and fingerprint it
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/melbete-bingo.apk
          (cd out && sha256sum melbete-bingo.apk > melbete-bingo.apk.sha256)
          cat out/melbete-bingo.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: melbete-bingo-apk
          path: out/
          if-no-files-found: error
