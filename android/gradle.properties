org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true

# ---- Melbete settings --------------------------------------------------------------------------
# REQUIRED: your bot's username WITHOUT the @ (the one BotFather gave you), e.g. MelbeteBingoBot.
# The app opens this bot in Telegram. Leave empty and the app tells the user it is not configured.
MELBETE_BOT_USERNAME=

# Shown to users and used for updates. Raise MELBETE_VERSION_CODE by 1 for every release you publish.
MELBETE_VERSION_NAME=1.0.0
MELBETE_VERSION_CODE=1
